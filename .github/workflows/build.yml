name: Windows build and deterministic tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        shell: pwsh
        run: ./Build.ps1
      - name: Build isolated DirectShow probe
        shell: pwsh
        run: ./scripts/Build-Camera.ps1 -Output ./app/camera -Probe
      - name: Test update integrity, rollback, audio clock and windows
        shell: pwsh
        run: |
          foreach ($flag in @('--recording-tools-tests', '--update-tests', '--audio-timing-test', '--ui-tests', '--wpf-ui-tests', '--feature-tests', '--camera-test', '--camera-2k-test', '--camera-hold-test', '--camera-formats-test', '--kvm-video-test', '--kvm-test')) {
            $p=Start-Process ./app/ScreenCapture.exe -ArgumentList $flag -PassThru -Wait -WindowStyle Hidden
            if($p.ExitCode -ne 0){throw "$flag failed"}
          }
