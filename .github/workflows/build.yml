name: Windows build and deterministic tests
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Build and validate Stream Deck plugin
        shell: pwsh
        run: ./scripts/Build-StreamDeck.ps1
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        shell: pwsh
        run: ./Build.ps1
      - name: Build isolated DirectShow probe
        shell: pwsh
        run: ./scripts/Build-Camera.ps1 -Output ./app/camera -Probe
      - name: Test official Stream Deck SDK against DeskGlide private IPC
        shell: pwsh
        run: |
          $env:DESKGLIDE_TEST_EXE=(Resolve-Path ./app/DeskGlide.exe).Path
          pnpm --dir streamdeck test
          if($LASTEXITCODE -ne 0){throw 'Stream Deck integration failed'}
      - name: Test recording, update integrity, rollback, audio clock and windows
        shell: pwsh
        run: |
          foreach ($flag in @('--install-recording-tools','--recording-audio-tail-tests','--recording-session-tests','--recording-capability-tests','--recording-routing-tests','--recording-performance-tests','--recording-remote-tests','--recording-node-tests','--recording-ndi-tests','--recording-settings-data-tests','--recording-session-media-tests','--recording-cpu-tests','--shutdown-tests', '--frame-memory-tests', '--streamdeck-tests', '--streamdeck-network-tests', '--recording-tools-tests', '--dependency-tests', '--ndi-runtime-package-test', '--update-tests', '--restart-tests', '--audio-timing-test', '--recording-pixels-test', '--recording-cadence-tests','--recording-frame-queue-tests','--recording-duplicate-tests', '--gpu-readback-tests', '--replay-app-tests', '--recording-sdr-tests', '--recording-pipe-test', '--ui-tests', '--wpf-ui-tests', '--tray-ui-tests', '--feature-tests', '--camera-test', '--camera-2k-test', '--camera-hold-test', '--camera-formats-test', '--kvm-video-test', '--kvm-test', '--monitor-layout-tests', '--kvm-input-tests','--screenshot-tests','--screenshot-ui-tests','--screenshot-render-performance-test', '--kvm-native-image-tests')) {
            $p=Start-Process ./app/DeskGlide.exe -ArgumentList $flag -PassThru -Wait -WindowStyle Hidden
            if($p.ExitCode -ne 0){
              if(Test-Path ./app/error.txt){Get-Content ./app/error.txt}
              throw "$flag failed"
            }
            if($flag -eq '--tray-ui-tests'){Get-Content ./app/tray-ui-tests.json}
          }
      - name: Build portable executable
        shell: pwsh
        run: |
          ./scripts/Build-Portable.ps1 -Payload ./app -Output ./portable-build
          New-Item -ItemType Directory -Path ./portable-check | Out-Null
          Copy-Item ./portable-build/DeskGlide.exe ./portable-check/DeskGlide.exe
      - name: Test portable executable without adjacent libraries
        shell: pwsh
        run: |
          foreach ($flag in @('--install-recording-tools','--recording-audio-tail-tests','--recording-session-tests','--recording-capability-tests','--recording-routing-tests','--recording-performance-tests','--recording-remote-tests','--recording-node-tests','--recording-ndi-tests','--recording-settings-data-tests','--recording-session-media-tests','--recording-cpu-tests','--shutdown-tests', '--frame-memory-tests', '--streamdeck-tests', '--streamdeck-network-tests', '--portable-tests', '--update-tests', '--restart-tests', '--recording-tools-tests', '--dependency-tests', '--ndi-runtime-package-test', '--audio-timing-test', '--recording-pixels-test', '--recording-cadence-tests','--recording-frame-queue-tests','--recording-duplicate-tests', '--gpu-readback-tests', '--replay-app-tests', '--recording-sdr-tests', '--recording-pipe-test', '--wpf-ui-tests', '--tray-ui-tests', '--feature-tests', '--kvm-video-test', '--kvm-test', '--monitor-layout-tests', '--kvm-input-tests','--screenshot-tests','--screenshot-ui-tests','--screenshot-render-performance-test', '--kvm-native-image-tests')) {
            $p=Start-Process ./portable-check/DeskGlide.exe -ArgumentList $flag -PassThru -Wait -WindowStyle Hidden
            if($p.ExitCode -ne 0){
              if(Test-Path "$env:LOCALAPPDATA/SdrCapture/Diagnostics/error.txt"){Get-Content "$env:LOCALAPPDATA/SdrCapture/Diagnostics/error.txt"}
              throw "Portable $flag failed"
            }
            if($flag -eq '--tray-ui-tests'){Get-Content "$env:LOCALAPPDATA/SdrCapture/Diagnostics/tray-ui-tests.json"}
          }
      - name: Upload validation and preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamdeck-validation
          path: |
            artifacts/streamdeck/*.streamDeckPlugin
            app/streamdeck*.json
            app/kvm-input-tests.json
            app/screenshot-tests.json
            app/screenshot-ui-tests.json
            app/screenshot-render-tests.json
            app/screenshot-latency-test.json
            app/screenshot-clipboard-tests.json
            app/screenshot-gpu-tests.json
            app/kvm-test.json
            app/kvm-input-thread-test.json
            app/monitor-layout-tests.json
            app/update-tests.json
            app/update-installation-tests.json
            app/recording-*.json
            app/recording-cadence-tests.json
            app/recording-frame-queue-tests.json
            app/recording-duplicate-tests.json
            app/gpu-readback-tests.json
            app/replay-app-tests.json
            app/recording-sdr-tests.json
            app/wpf-preview/*-10.png
            app/wpf-preview/*-3.png
            app/wpf-ui-tests.json
            app/error.txt
