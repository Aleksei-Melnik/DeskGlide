name: Windows build and deterministic tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        shell: pwsh
        run: ./Build.ps1
      - name: Build isolated DirectShow probe
        shell: pwsh
        run: ./scripts/Build-Camera.ps1 -Output ./app/camera -Probe
      - name: Test update integrity, rollback, audio clock and windows
        shell: pwsh
        run: |
          foreach ($flag in @('--recording-tools-tests', '--dependency-tests', '--ndi-runtime-package-test', '--update-tests', '--restart-tests', '--audio-timing-test', '--ui-tests', '--wpf-ui-tests', '--feature-tests', '--camera-test', '--camera-2k-test', '--camera-hold-test', '--camera-formats-test', '--kvm-video-test', '--kvm-test')) {
            $p=Start-Process ./app/DeskGlide.exe -ArgumentList $flag -PassThru -Wait -WindowStyle Hidden
            if($p.ExitCode -ne 0){
              if(Test-Path ./app/error.txt){Get-Content ./app/error.txt}
              throw "$flag failed"
            }
          }
      - name: Build portable executable
        shell: pwsh
        run: |
          ./scripts/Build-Portable.ps1 -Payload ./app -Output ./portable-build
          New-Item -ItemType Directory -Path ./portable-check | Out-Null
          Copy-Item ./portable-build/DeskGlide.exe ./portable-check/DeskGlide.exe
      - name: Test portable executable without adjacent libraries
        shell: pwsh
        run: |
          foreach ($flag in @('--portable-tests', '--update-tests', '--restart-tests', '--recording-tools-tests', '--dependency-tests', '--ndi-runtime-package-test', '--audio-timing-test', '--wpf-ui-tests', '--feature-tests', '--kvm-video-test', '--kvm-test')) {
            $p=Start-Process ./portable-check/DeskGlide.exe -ArgumentList $flag -PassThru -Wait -WindowStyle Hidden
            if($p.ExitCode -ne 0){
              if(Test-Path "$env:LOCALAPPDATA/SdrCapture/Diagnostics/error.txt"){Get-Content "$env:LOCALAPPDATA/SdrCapture/Diagnostics/error.txt"}
              throw "Portable $flag failed"
            }
          }
